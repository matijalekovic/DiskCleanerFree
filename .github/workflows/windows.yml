# Builds the Windows app (Tauri) for x64 and ARM64 and attaches the installers to the GitHub release.
name: Windows build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to (leave empty to only build)
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx tauri build --target ${{ matrix.target }} --bundles nsis

      - name: Collect installer and portable app
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          cp src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe "out/DiskCleanerFree-$VERSION-Windows-${{ matrix.arch }}-Setup.exe"
          cp "src-tauri/target/${{ matrix.target }}/release/Disk Cleaner Free.exe" "out/DiskCleanerFree-$VERSION-Windows-${{ matrix.arch }}-Portable.exe"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: windows/out/*.exe

      - name: Attach to release
        if: github.event_name == 'release' || inputs.tag != ''
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" out/*.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
