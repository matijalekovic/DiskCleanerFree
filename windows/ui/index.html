<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disk Cleaner Free</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header" data-tauri-drag-region>
        <button class="icon-button no-drag" id="toggleSidebar" title="Hide sidebar" data-icon="sidebar"></button>
      </div>
      <nav class="sources" id="sources"></nav>
      <div class="sidebar-footer">
        <button class="button wide" id="scanFolder"><span data-icon="folderAdd"></span>Scan Folder…</button>
      </div>
    </aside>
    <main class="content">
      <header class="titlebar" data-tauri-drag-region>
        <button class="icon-button no-drag hidden" id="showSidebar" title="Show sidebar" data-icon="sidebar"></button>
        <div class="title-block" data-tauri-drag-region>
          <div class="title" id="title">Disk Cleaner Free</div>
          <div class="subtitle" id="subtitle"></div>
        </div>
        <div class="toolbar no-drag" id="toolbar"></div>
      </header>
      <section class="view" id="view"></section>
    </main>
  </div>
  <div class="modal-backdrop hidden" id="modal"></div>
  <script src="bridge.js"></script>
  <script src="icons.js"></script>
  <script src="format.js"></script>
  <script src="sunburst.js"></script>
  <script src="app.js"></script>
</body>
</html>
